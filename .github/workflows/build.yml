name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs on every PR and push. This is the merge gate — it never builds or signs an APK, so a PR
  # from a fork (no access to signing secrets) still gets full feedback.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run detekt
        run: ./gradlew detekt --stacktrace

      # Gates everything below. Crypto, money-type, reconciliation and
      # golden-test failures must never produce an installable APK.
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Upload Room schema export
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: core/database/schemas/

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  # Runs on every trigger, including pull_request — a debug build is cheap smoke-test signal for
  # a PR. Signing/release only ever happens for a push to main (or workflow_dispatch): a PR never
  # cuts a GitHub Release or builds a signed APK, even though the secrets would technically be
  # visible to it (same-repo PRs, not a fork).
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check release signing secrets
        id: release_secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: steps.release_secrets.outputs.present != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME=$(grep -m1 'val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 'val appVersionCode' app/build.gradle.kts | sed -E 's/.*= *([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename debug APK
        if: steps.release_secrets.outputs.present != 'true'
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/Ledgerly-v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}-debug.apk"

      - name: Decode release keystore
        if: steps.release_secrets.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release APK
        if: steps.release_secrets.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename release APK
        if: steps.release_secrets.outputs.present == 'true'
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/Ledgerly-v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}-release.apk"

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main' && steps.release_secrets.outputs.present != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with signed APK
        if: steps.release_secrets.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_name }}-build${{ github.run_number }}
          name: Ledgerly v${{ steps.app_version.outputs.version_name }} (build ${{ github.run_number }})
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            versionCode: ${{ steps.app_version.outputs.version_code }}
